<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Closure</h1>

    <script>
      // closure
      // - function returns a reference of inner function
      // - inner function remembers the members of outer function

      // scope: global
      function outer() {
        console.log(`inside outer function`)

        // scope: local
        let num = 100
        console.log(`num = ${num}`)

        // scope: local
        const innerFunction = () => {
          console.log('inside inner function')
          console.log(`num = ${num}`)
          num += 1
        }

        return innerFunction
      }

      // call the outer function
      const func = outer()
      console.log(`func = ${func}`)
      func()
      func()
      func()
      func()
      func()

      // console.log(`num = ${num}`)
      // innerFunction()
    </script>
  </body>
</html>
