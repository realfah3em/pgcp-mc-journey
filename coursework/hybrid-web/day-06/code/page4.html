<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Rest Parameters</h1>
    <script>
      // every function in JS will accept a hidden parameter named arguments
      // arguments is an array of all the arguments passed
      function function1(p1, p2) {
        console.log(`inside function1`)
        console.log(`p1: ${p1}, p2 = ${p2}`)
        console.log(`arguments = `, arguments)

        let sum = 0
        for (const value of arguments) {
          sum += value
        }
        console.log(`sum = ${sum}`)
      }

      // function1(10, 20)
      // function1(10, 20, 30)
      // function1(10, 20, 30, 40)
      // function1(10, 20, 30, 40, 50)

      // modern syntax
      // rest parameters: ...
      // - used to get all the arguments passed to the function
      // - params here is an array
      // - rest parameter must be the last parameter in the parameters list
      function function2(p1, p2, ...values) {
        console.log(`values = `, values)
        console.log(`p1 = ${p1}, p2 = ${p2}`)
      }

      function2(10, 20)
      function2(10, 20, 30)
      function2(10, 20, 30, 40)
      function2(10, 20, 30, 40, 50)
    </script>
  </body>
</html>
