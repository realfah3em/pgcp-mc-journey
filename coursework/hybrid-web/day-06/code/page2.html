<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Function Attributes</h1>
    <script>
      function function1(p1, p2) {
        console.log(`inside function1`)
        console.log(`p1 = ${p1}, p2 = ${p2}`)
      }

      console.log(`function1 = ${function1}, type = ${typeof function1}`)

      // get the attributes
      console.log(`name = ${function1.name}`)
      console.log(`source code = ${function1.toString()}`)
      console.log(`arguments = ${function1.arguments}`)
      console.log(`length = ${function1.length}`)

      // adding a new attribute
      function1.version = '1.0'
      function1.myAttribute = 'test-value'
      console.log(`function1 version = ${function1.version}`)
      console.log(`function1.myAttribute = ${function1.myAttribute}`)

      // call the function
      function1(10, 20)

      // function can accept more number of arguments than declared ones
      function1(10, 20, 30, 40, 50)

      // since p2 is not passed, it will be taken as undefined
      function1(10)

      // p1: undefined, p2: undefined
      function1()
    </script>
  </body>
</html>
