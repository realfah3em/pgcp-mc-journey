<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Set</h1>

    <script>
      function function1() {
        // create a set of numbers
        const set = new Set([10, 20, 30, 40, 50, 10, 20, 30, 40, 50])
        console.log(set)

        // add a new value
        set.add(10) // ignored
        set.add(60)
        set.add(70)
        console.log(set)

        // delete an existing value
        set.delete(50)
        console.log(set)
        console.log(`size = ${set.size}`)

        // clear all the entries
        set.clear()
        console.log(set)
        console.log(`size = ${set.size}`)
      }

      // function1()

      function function2() {
        // array of names
        const names = ['john', 'alice', 'john', 'jane', 'alice', 'john', 'steve', 'steve', 'bill', 'bill', 'bill']
        console.log(`names = `, names)

        // find the unique names from the names collection
        const uniqueNames = []
        for (const name of names) {
          // check of name already exists
          if (!uniqueNames.includes(name)) {
            uniqueNames.push(name)
          }
        }
        console.log(`unique names = `, uniqueNames)

        // by converting array to set, we are eliminating the duplicate values
        console.log(`unique names = `, new Set(names))
      }

      function2()
    </script>
  </body>
</html>
