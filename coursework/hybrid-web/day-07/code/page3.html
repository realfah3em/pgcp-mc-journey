<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Array Iteration Logic</h1>
    <script>
      function function1() {
        // create an array of numbers
        const numbers = [10, 20, 30, 40, 50]
        console.log(numbers)

        // traditional for loop
        for (let index = 0; index < numbers.length; index++) {
          console.log(`numbers[${index}] = ${numbers[index]}`)
        }
      }

      // function1()

      function function2() {
        // create an array of numbers
        const numbers = [10, 20, 30, 40, 50]
        console.log(numbers)

        // for..of loop
        // - does not allow the access of index position
        // - the index is maintained by JS
        // - by default starts from first position and goes till the last position
        for (const value of numbers) {
          console.log(`value = ${value}`)
        }
      }

      // function2()

      function function3() {
        // create an array of numbers
        // numbers is an object having integer keys
        // maintained by object internally
        const numbers = [10, 20, 30, 40, 50]
        console.log(numbers)
        console.log(`type of numbers = ${typeof numbers}`)

        // for..in loop
        // - by default starts from first position and goes till the last position
        for (const key in numbers) {
          console.log(`numbers[${key}] = ${numbers[key]}`)
        }
        console.log('-')

        // object
        // person is an object with keys of type string
        const person = {
          name: 'person1',
          email: 'person1@test.com',
          age: 40,
        }
        console.log(person)
        console.log(`type of person = ${typeof person}`)
        for (const key in person) {
          console.log(`key = ${key}, value = ${person[key]}`)
        }
      }

      // function3()

      function function4() {
        // create an array of numbers
        const numbers = [10, 20, 30, 40, 50]
        console.log(numbers)

        // get all the values using forEach
        numbers.forEach((value) => {
          console.log(`value = ${value}`)
        })
        console.log('-')

        // arrow function shorthand method
        numbers.forEach((value) => console.log(`value = ${value}`))
      }

      function4()
    </script>
  </body>
</html>
