  <body>
    <h1>JS Demo</h1>

    <script>
      // mutable variable declaration
      let num = 200
      console.log(`num = ${num}`)

      num = 400
      console.log(`num = ${num}`)

      // constant declaration
      const canVote = true
      console.log(`canVote = ${canVote}`)

      // not possible to change a constant variable
      // canVote = false
      // console.log(`canVote = ${canVote}`)
    </script>
  </body>
