<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>page6</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .item {
        width: 100px;
        height: 100px;
        display: inline-block;
        background-color: red;
        border-radius: 10px;
        margin: 10px;
      }
    </style>
  </head>
  <body class="p-4">
    <h1 class="font-bold text-4xl mb-3">Shadow</h1>

    <div class="item shadow-blue-500 shadow-sm"></div>
    <div class="item shadow-blue-500 shadow"></div>
    <div class="item shadow-blue-500 shadow-lg"></div>
    <div class="item shadow-blue-500 shadow-xl"></div>
    <div class="item shadow-blue-500 shadow-2xl"></div>
  </body>
</html>
