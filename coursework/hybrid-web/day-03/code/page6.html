<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>page6</title>
    <style>
      div {
        width: 100px;
        height: 100px;
        border-radius: 10px;
        margin: 20px;
        display: inline-block;
      }

      .div1 {
        background-color: red;
        box-shadow: 4px 2px 5px 0px rgba(0, 0, 0, 0.8);
      }

      .div2 {
        box-shadow: inset 0px 0px 10px 0px rgba(0, 0, 0, 0.8);
      }

      h3 {
        text-shadow: 4px 0px 2px rgba(0, 0, 0, 0.8);
      }

      h1 {
        text-shadow: 2px 2px 2px red;
      }
    </style>
  </head>
  <body>
    <h1>Shadow</h1>
    <hr />

    <h2>Box Shadow</h2>
    <div class="div1">div1</div>
    <div class="div2">div2</div>
    <hr />

    <h2>Text Shadow</h2>

    <h3>this is a header3</h3>
  </body>
</html>
