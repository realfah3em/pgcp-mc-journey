<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>page4</title>
    <style>
      button {
        border: none;
        background-color: rgb(239, 201, 141);
        padding: 10px;
        border-radius: 5px;
      }
      button:hover {
        cursor: pointer;
        background-color: rgb(135, 113, 78);
        color: lightgray;
      }

      .b1 {
        /* default value */
        position: static;
        top: 20px;
        left: 20px;
      }
      .b2 {
        position: relative;
        top: 20px;
        left: 20px;
      }
      .b3 {
        position: absolute;
        bottom: 20px;
        left: 20px;
      }
      .b4 {
        position: fixed;
        bottom: 20px;
        right: 20px;
      }
      .parent {
        width: 300px;
        height: 400px;
        background-color: lightgray;
        margin-top: 50px;

        /* this will add the button3 inside the parent */
        position: relative;
      }
      .b5 {
        top: 10px;
        position: sticky;
      }
    </style>
  </head>
  <body>
    <h1>CSS Positioning</h1>

    <button class="b1">button1</button>
    <button class="b2">button2</button>
    <button class="b3">button3</button>
    <button class="b4">Chat with us</button>
    <button class="b5">button5</button>
    <hr />

    <div class="parent">
      <button class="b1">div-button1</button>
      <button class="b2">div-button2</button>
      <button class="b3">div-button3</button>
      <button class="b5">div-button5</button>
    </div>
