<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>page3</title>
    <style>
      div.red ~ p {
        color: red;
      }

      div.green ~ p {
        color: green;
      }

      div.red ~ span {
        color: blue;
      }
    </style>
  </head>
  <body>
    <h1>General Sibling Selector (~)</h1>

    <p>this is para before div</p>

    <div class="red">this is a div1</div>
    <p>this is a para after the div</p>
    <p>this is a para after the div</p>
    <p>this is a para after the div</p>

    <span>this is a span</span>

    <div class="green">this is a div2</div>
    <p>this is a para after the div2</p>
    <p>this is a para after the div2</p>
    <p>this is a para after the div2</p>
  </body>
</html>
