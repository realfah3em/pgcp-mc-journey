<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>page3</title>
    <style>
      div + p {
        color: red;
      }
    </style>
  </head>
  <body>
    <h1>Adjacent Sibling Selector (+)</h1>

    <p>this is para before div</p>
    <div>this is a div</div>
    <p>this is a para after the div</p>
    <p>this is a para after the div</p>
    <p>this is a para after the div</p>
    <span>this is a span</span>
    <p>this is a para after the span</p>
  </body>
</html>
