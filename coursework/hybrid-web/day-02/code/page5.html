<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>page5</title>
  </head>
  <body>
    <h1>Form Demo</h1>

    <!-- form container -->
    <form>
      <div>
        <label for="">First Name</label>
        <input type="text" />
      </div>
      <div>
        <label for="">Last Name</label>
        <input type="text" />
      </div>
      <div>
        <label for="">Email</label>
        <input type="email" />
      </div>
      <div>
        <label for="">Phone Number</label>
        <input type="tel" />
      </div>
      <div>
        <label for="">Birth Date</label>
        <input type="date" />
      </div>
      <div>
        <label for="">Birth Time</label>
        <input type="time" />
      </div>
      <div>
        <label for="">Address</label>
        <textarea rows="5"></textarea>
      </div>
      <div>
        <label for="">City</label>
        <select>
          <optgroup title="Metro">
            <option value="pune">Pune</option>
            <option value="mumbai">Mumbai</option>
          </optgroup>
          <optgroup title="Non-metro">
            <option value="satara">Satara</option>
            <option value="karad">Karad</option>
            <option value="nashik">Nashik</option>
          </optgroup>
        </select>
      </div>
      <div>
        <label for="">Favorite Fruits</label>
        <select multiple>
          <option>Apple</option>
          <option>Banana</option>
          <option>Guava</option>
          <option>Pineapple</option>
        </select>
      </div>
      <div>
        <label for="">Resume</label>
        <input type="file" />
      </div>
      <div>
        <input
          value="Register"
          type="submit" />
      </div>
    </form>
  </body>
</html>
