<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>page3</title>
    <style>
      p {
        font-size: 25px;
      }

      /* select all elements having class r */
      .r {
        color: red;
      }

      /* select all elements having class g */
      .g {
        color: green;
      }

      /* select only div elements having class b */
      div.b {
        color: blue;
      }

      div.google {
        font-size: 80px;
        font-weight: bold;
      }

      span.blue {
        color: rgb(83, 134, 239);
      }

      span.red {
        color: rgb(220, 80, 65);
      }

      span.yellow {
        color: rgb(240, 190, 65);
      }

      span.green {
        color: rgb(88, 167, 93);
      }
    </style>
  </head>
  <body>
    <h1>Class Selector (.)</h1>
    <div class="google">
      <span class="blue">G</span>
      <span class="red">o</span>
      <span class="yellow">o</span>
      <span class="blue">g</span>
      <span class="green">l</span>
      <span class="red">e</span>
    </div>
    <hr />

    <p class="r">this is para1</p>
    <p class="r">this is para2</p>
    <p class="g">this is para3</p>
    <p class="g">this is para4</p>
    <p class="b">this is para5</p>
    <p class="b">this is para6</p>
    <hr />

    <div class="r">this is div1</div>
    <div class="r">this is div2</div>
    <div class="g">this is div3</div>
    <div class="g">this is div4</div>
    <div class="b">this is div5</div>
    <div class="b">this is div6</div>
    <hr />

    <span class="r">this is span1</span>
    <span class="r">this is span2</span>
    <span class="g">this is span3</span>
    <span class="g">this is span4</span>
    <span class="b">this is span5</span>
    <span class="b">this is span6</span>
  </body>
</html>
