<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>page5</title>
  </head>
  <body>
    <h1>Table Demo</h1>

    <!-- table container -->
    <table border="1">
      <!-- table header -->
      <thead>
        <tr>
          <th>No</th>
          <th>Title</th>
          <th>Price</th>
          <th>Quantity</th>
          <th>Total Price</th>
        </tr>
      </thead>

      <!-- table footer -->
      <tfoot>
        <tr>
          <th colspan="4">Total Price</th>
          <th>1084800</th>
        </tr>
      </tfoot>

      <!-- table body -->
      <tbody>
        <tr>
          <td>1</td>
          <td>iPhone 18 Pro Max</td>
          <td>164900</td>
          <td>1</td>
          <td>164900</td>
        </tr>
        <tr>
          <td>2</td>
          <td>iPhone Duo</td>
          <td>300000</td>
          <td>1</td>
          <td>300000</td>
        </tr>
        <tr>
          <td>3</td>
          <td>MacBook Pro M5 Pro</td>
          <td>619900</td>
          <td>1</td>
          <td>619900</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
