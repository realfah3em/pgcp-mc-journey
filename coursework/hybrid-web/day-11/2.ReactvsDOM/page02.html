<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Manipulation</title>
</head>

<body onload="startMyApp()">
    <div id="root"></div>
    <script>
        function startMyApp() {
            const div = document.getElementById('root')
            //div.innerHTML = '<h1>Hello from my SPA Application</h1>'
            const h1 = document.createElement('h1', null)
            h1.textContent = 'Hello from My SPA'
            console.log(h1)
            div.appendChild(h1)
        }
    </script>
</body>

</html>
