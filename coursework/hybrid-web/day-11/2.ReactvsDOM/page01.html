<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pure React</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
</head>

<body>

    <div id="root"></div>
    <script>
        const og_container = document.getElementById('root')
        const v_container = ReactDOM.createRoot(og_container)
        const h1 = React.createElement('h1', null, 'Hello from My SPA')
        // v_container.render('<h1>Hello from My SPA</h1>')
        //v_container.render('<h1>Hello from My SPA</h1>')
        v_container.render(h1)
    </script>

</body>

</html>
