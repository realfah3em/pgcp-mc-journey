<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSX</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

</head>

<body onload="startReact()">
    <div id="root">
        <!-- 
        <h1>This is a header</h1>
        <div>
            <p>This is para 1</p>
            <p>This is para 2</p>
        </div>
         -->
    </div>
    <script>
        function startReact() {
            const root = ReactDOM.createRoot(document.getElementById('root'))
            const h1 = React.createElement('h1', null, 'This is a header')
            const p1 = React.createElement('p', null, 'This is para1')
            const p2 = React.createElement('p', null, 'This is para2')
            const div = React.createElement('div', null, [p1, p2])
            root.render([h1, div])
        }
    </script>
</body>

</html>
