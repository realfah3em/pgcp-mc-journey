<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSX</title>

</head>

<body onload="startReact()">
    <div id="root">
        <!-- 
        <h1>This is a header</h1>
        <div>
            <p>This is para 1</p>
            <p>This is para 2</p>
        </div>
         -->
    </div>
    <script>
        function startReact() {
            const root = document.getElementById('root')
            const div = `
                    <h1>This is a Header</h1>
                    <div>
                        <p>This is a para1</p>
                        <p>This is a para2</p>
                    </div>`
            root.innerHTML = div
        }
    </script>
</body>

</html>
