<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>page5</title>
    <style>
      .box {
        width: 100px;
        height: 100px;
        background-color: red;
        border-radius: 10px;
        margin: 20px;
        display: inline-block;
        transition: 0.5s;
      }

      .translate:hover {
        transform: translate(5px, 5px);
      }

      .scale:hover {
        transform: scale(1.5);
      }

      button {
        border: none;
        background: linear-gradient(to right, red, yellow);
        padding: 10px;
        font-weight: 600;
        border-radius: 5px;
        transition: 0.2s;
      }
      button:hover {
        cursor: pointer;
        box-shadow: 0 2px 2px gray;
        transform: translate(1px, 1px);
      }
      img {
        width: 80px;
        height: 80px;
        border: solid;
        margin: 10px;
        padding: 5px;
        transition: all 1s;
      }

      img:hover {
        transform: scale(1.2) rotate(5deg);
      }

      .rotate:hover {
        transform: rotate(45deg);
      }
    </style>
  </head>
  <body>
    <h1>Transform</h1>
    <div class="box translate"></div>
    <div class="box scale"></div>
    <div class="box rotate"></div>

    <hr />
    <h2>Button</h2>
    <button>button 1</button>
    <button>button 1</button>
    <button>button 1</button>
    <button>button 1</button>
