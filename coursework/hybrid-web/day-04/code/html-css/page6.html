<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>page6</title>
    <style>
      /* animation definition */
      @keyframes animation1 {
        from {
          background-color: red;
          transform: rotate(0deg);
        }
        to {
          background-color: blue;
          transform: rotate(180deg);
        }
      }

      @keyframes heart-beat1 {
        from {
          transform: scale(1);
        }
        to {
          transform: scale(1.3);
        }
      }

      @keyframes heart-beat {
        0% {
          transform: scale(1);
        }
        25% {
          transform: scale(1.2);
        }
        50% {
          transform: scale(1.4);
        }
        75% {
          transform: scale(1.2);
        }
        100% {
          transform: scale(1);
        }
      }

      .div1 {
        width: 100px;
        height: 100px;
        background-color: red;
        border-radius: 10px;

        animation-name: animation1;
        animation-duration: 2s;
        animation-play-state: running;
        animation-iteration-count: infinite;
        animation-direction: alternate;
      }

      img {
        width: 300px;
        height: 300px;

        /* shorthand */
        animation: heart-beat 2s ease 0s infinite alternate;
      }
    </style>
  </head>
  <body>
    <h1>CSS Animations</h1>

    <h2>Simple Animation</h2>
    <div class="div1"></div>
    <hr />

    <img
      src="images/heart.jpg"
      alt="" />
  </body>
</html>
