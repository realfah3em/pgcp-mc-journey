<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>page4</title>
    <style>
      .item1 {
        width: 100px;
        height: 100px;
        background-color: red;
        border-radius: 10px;
        transition: all 1s;
      }

      .item1:hover {
        background-color: blue;
        width: 110px;
        height: 110px;
      }

      img {
        width: 80px;
        height: 80px;
        border: solid;
        margin: 10px;
        padding: 5px;
        transition: all 0.5s;
      }

      img:hover {
        width: 110px;
        height: 110px;
      }

      button {
        border: none;
        background: linear-gradient(to right, red, yellow);
        padding: 10px;
        font-weight: 600;
        border-radius: 5px;
        transition: 0.2s;
      }
      button:hover {
        cursor: pointer;
        box-shadow: 0 2px 2px gray;
      }
    </style>
  </head>
  <body>
    <h1>Transition</h1>

    <div class="item1"></div>
    <hr />

    <h2>Photo Gallery</h2>
    <div class="gallery">
      <img
        src="images/bill_gates.jpg"
        alt="" />
      <img
        src="images/elon_musk.jpg"
        alt="" />
      <img
        src="images/jeff_bezos.jpg"
        alt="" />
      <img
        src="images/larry_page.jpg"
        alt="" />
      <img
        src="images/mark.jpg"
        alt="" />
      <img
        src="images/steve_jobs.jpg"
        alt="" />
      <img
        src="images/sundar_pichai.jpg"
        alt="" />
      <img
        src="images/surgey_bin.jpg"
        alt="" />
      <img
        src="images/tim_cook.jpg"
        alt="" />
    </div>
    <hr />

    <h2>Button</h2>
    <button>button 1</button>
  </body>
</html>
